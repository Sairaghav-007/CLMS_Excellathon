services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: clms_postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: clms_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "12345"
    volumes:
      - clms_pgdata:/var/lib/postgresql/data
      - ./Database/database.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clms_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Spring Boot Backend Service
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: clms_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/clms_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "12345"
      JWT_SECRET: "change-this-to-a-very-long-secret-key-1234567890"
      PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy

  # 3. React/Vite Frontend Service
  frontend:
    build:
      context: ./FrontEnd
      dockerfile: Dockerfile
    container_name: clms_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  clms_pgdata:
    driver: local
